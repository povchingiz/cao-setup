# ============================================================
#  CAO — single source of truth for all NON-SECRET settings.
#  Edit here, then run:  ./apply.sh
#  (Secrets live in .env only — never here.)
# ============================================================

[orchestrator]
default_supervisor      = "code_supervisor"
default_provider        = "claude_code"
worktree_isolation      = true
max_concurrent_workers  = 4
server_port             = 9889

# ---- Endpoint for the bulk worker (opencode) ----
# The bulk worker runs the cheap/high-throughput half of the work (scaffolding,
# schemas, boilerplate) through opencode against ANY OpenAI-compatible endpoint:
# OpenRouter, a provider gateway, or a local server. Point base_url at yours and
# pick a low-cost model. The API key is NOT here — it lives in .env as
# LOCAL_API_KEY and is referenced as {env:LOCAL_API_KEY}.
#
# Don't want a separate bulk endpoint? Set workers.opencode_worker.provider to
# claude_code / codex / antigravity_cli instead (see below) and this endpoint is
# unused — the bulk role then runs on one of those engines.
[endpoint]
name     = "bulk"                        # opencode provider id (any label)
base_url = "https://openrouter.ai/api/v1"   # example; use your own gateway
# Models this endpoint serves (exact ids as the endpoint lists them).
models   = [
  "<provider>/<cheap-model>",
  "<provider>/<alt-model>",
]
# Default model the bulk worker uses (must be one of `models` above).
default_model = "<provider>/<cheap-model>"

# ---- Workers: engine, model, and ROLE — the one place to reconfigure them ----
# For each worker:
#   provider  = CAO provider id (claude_code | opencode_cli | codex | antigravity_cli)
#   model     = optional; applies to opencode. Bare id -> "<endpoint.name>/<id>".
#   aliases   = the words the supervisor uses to route to this worker
#   focus     = one line describing what it does (shown in the routing table)
# `apply.sh` writes provider/model into each worker's frontmatter AND regenerates
# the supervisor's routing table from aliases+focus — so this block is the single
# source for "who does what". The detailed prompt (execution rules) stays in
# prompts/<worker>.md; only the routing table is generated.
[workers.claude_worker]
provider = "claude_code"
aliases  = ["claude", "architect"]
focus    = "architecture, domain logic, API contracts, DDD boundaries, refactoring, hard reasoning"

[workers.coder_worker]
provider = "opencode_cli"
model    = "<provider>/<cheap-model>"   # or drop + switch provider to run bulk on another engine
aliases  = ["coder", "code", "bulk", "opencode", "cheap"]
focus    = "cheap high-throughput coding model: boilerplate, DB schemas, migrations, repetitive utilities, implementing against a contract/blueprint"

[workers.codex_worker]
provider = "codex"
aliases  = ["codex", "frontend", "ui"]
focus    = "React/Vue/Svelte, CSS, templates, UI components"

[workers.analyst_worker]
provider = "antigravity_cli"
aliases  = ["analyst", "context", "research", "map"]
focus    = "whole-repo understanding on a huge-context engine: dependency maps, 'where is X used', cross-file impact, reading long docs, and multimodal"

[workers.antigravity_worker]
provider = "antigravity_cli"
aliases  = ["qa", "tests", "review", "audit"]
focus    = "QA / audit only: run tests, security review, edge cases (see analyst_worker for codebase understanding)"

[workers.copilot_worker]
provider = "copilot_cli"
aliases  = ["copilot", "deploy", "ci", "github"]
focus    = "GitHub PRs, Actions workflows, CI/CD pipelines, deployment configs (in progress / WIP)"

[workers.hermes_worker]
provider = "hermes_cli"
aliases  = ["hermes", "nous"]
focus    = "open-source reasoning and autonomous coding: complex implementation, scaffolding, targeted refactors against a contract. Distinct from coder_worker - route here to compare engines on the same task class, never as a synonym for 'bulk'."

# Profiles registered with CAO (order = install order). Supervisor first.
[profiles]
register = [
  "code_supervisor",
  "claude_worker",
  "coder_worker",
  "codex_worker",
  "analyst_worker",
  "antigravity_worker",
  "copilot_worker",
  "hermes_worker",
]

