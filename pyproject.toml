[project]
name = "cao-setup"
version = "0.2.0"
description = "Provisioner, health checker, and config layer for the CLI Agent Orchestrator (CAO)"
requires-python = ">=3.11"
authors = [
    { name = "Chingiz" }
]
readme = "README.md"
keywords = ["cli", "agent", "orchestrator", "claude", "opencode", "codex", "gemini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
